<!DOCTYPE html>
<html class="dark" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Renew Lease Contract | Aetheris Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .primary-glow {
            box-shadow: 0 0 20px rgba(173, 198, 255, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b1326; }
        ::-webkit-scrollbar-thumb { background: #343538; border-radius: 10px; }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container": "#1e1f23", "surface-variant": "#343538", "surface": "#0b1326",
                        "on-surface-variant": "#c4c6d0", "on-primary": "#122f5f", "secondary-container": "#00b47d",
                        "primary": "#d8e2ff", "surface-container-lowest": "#0d0e11", "outline-variant": "#44474f",
                        "secondary": "#4edea3", "on-surface": "#dae2fd", "background": "#0b1326",
                        "error": "#ffb4ab", "on-error": "#690005"
                    },
                    fontFamily: {
                        "nav-label": ["manrope"], "eyebrow": ["inter"], "h1": ["manrope"], "body-primary": ["inter"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-primary overflow-hidden">
<!-- Side Navigation -->
<aside class="fixed left-0 top-0 h-screen w-64 bg-surface-container/80 backdrop-blur-3xl flex flex-col p-6 space-y-4 z-50">
    <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center text-primary">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">domain</span>
        </div>
        <div>
            <h2 class="font-h1 text-lg font-bold text-primary tracking-tight">Aetheris Admin</h2>
            <p class="text-[10px] text-on-surface-variant uppercase tracking-widest">Management Portal</p>
        </div>
    </div>
    <nav class="flex-1 space-y-2">
        <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant font-medium hover:bg-surface-variant hover:text-on-surface transition-colors rounded-xl" href="/owner-pages/dashboard.html">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-nav-label">Dashboard</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-primary font-bold bg-primary/10 rounded-xl transition-all scale-95 duration-150" href="/owner-pages/apartments.html">
            <span class="material-symbols-outlined">domain</span>
            <span class="font-nav-label">Apartments</span>
        </a>
        <!-- Add other links as needed -->
    </nav>
</aside>

<!-- Top Navigation -->
<header class="fixed top-0 right-0 h-16 w-[calc(100%-16rem)] backdrop-blur-2xl bg-surface/80 flex items-center justify-between px-10 z-40 border-b border-white/5">
    <div class="flex items-center flex-1">
        <span class="font-eyebrow text-[10px] uppercase tracking-widest text-on-surface-variant">Lease Processing Module</span>
    </div>
</header>

<!-- Main Canvas -->
<main class="ml-64 mt-16 h-[calc(100vh-4rem)] overflow-y-auto overflow-x-hidden relative">
    <!-- Atmospheric Background Effect -->
    <div class="absolute top-0 right-0 -z-10 w-[600px] h-[600px] bg-primary/5 blur-[120px] rounded-full translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>

    <div class="max-w-[80rem] mx-auto p-10">
        <!-- Header Section -->
        <div class="mb-10">
            <span class="font-eyebrow text-[11px] text-primary uppercase tracking-[0.2em] mb-3 block">Contract Management</span>
            <h1 class="font-h1 text-5xl font-extrabold text-on-surface">Renew Lease Contract</h1>
        </div>

        <!-- Form Container -->
        <div class="flex justify-center">
            <div class="w-full max-w-2xl glass-panel p-10 rounded-[2.5rem]">
                <form class="space-y-8" id="renewalForm">

                    <!-- Dropdown & Dynamic Tenant Section -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2 relative">
                            <label class="font-eyebrow text-[11px] font-bold text-on-surface-variant/70 ml-4 tracking-widest uppercase">Select Apartment</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary text-[18px]">domain</span>
                                <select id="flatSelect" name="flatId" required class="w-full bg-surface-container-lowest border border-white/5 h-14 pl-12 pr-10 rounded-2xl text-sm focus:ring-2 focus:ring-primary/50 transition-all appearance-none cursor-pointer">
                                    <option value="" disabled selected>Loading apartments...</option>
                                </select>
                                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="font-eyebrow text-[11px] font-bold text-on-surface-variant/70 ml-4 tracking-widest uppercase">Current Tenants (Auto-linked)</label>
                            <div id="tenantContainer" class="w-full bg-surface-container-lowest/50 border border-white/5 min-h-[3.5rem] p-3 rounded-2xl flex flex-wrap gap-2 items-center">
                                <span class="text-xs text-on-surface-variant/50 italic">Select an apartment first...</span>
                            </div>
                        </div>
                    </div>

                    <!-- Date Range Section (Auto-calculated) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="font-eyebrow text-[11px] font-bold text-primary ml-4 tracking-widest uppercase">New Start Date</label>
                            <input id="startDate" name="startDate" required type="date" class="w-full bg-surface-container-lowest border border-white/5 h-14 px-6 rounded-2xl text-sm focus:ring-2 focus:ring-primary/50 transition-all [color-scheme:dark]"/>
                        </div>
                        <div class="space-y-2">
                            <label class="font-eyebrow text-[11px] font-bold text-primary ml-4 tracking-widest uppercase">New End Date (11 Months)</label>
                            <input id="endDate" name="endDate" required type="date" class="w-full bg-surface-container-lowest border border-white/5 h-14 px-6 rounded-2xl text-sm focus:ring-2 focus:ring-primary/50 transition-all [color-scheme:dark]"/>
                        </div>
                    </div>

                    <!-- Financial Section -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="font-eyebrow text-[11px] font-bold text-primary ml-4 tracking-widest uppercase">Monthly Rent (USD)</label>
                            <div class="relative">
                                <span class="absolute left-6 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">$</span>
                                <input id="monthlyRent" name="monthlyRent" required step="0.01" type="number" class="w-full bg-surface-container-lowest border border-white/5 h-14 pl-12 pr-6 rounded-2xl text-sm focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-on-surface-variant/30" placeholder="0.00"/>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="font-eyebrow text-[11px] font-bold text-primary ml-4 tracking-widest uppercase">Maintenance (USD)</label>
                            <div class="relative">
                                <span class="absolute left-6 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">$</span>
                                <input id="maintenanceFee" name="maintenanceFee" required step="0.01" type="number" class="w-full bg-surface-container-lowest border border-white/5 h-14 pl-12 pr-6 rounded-2xl text-sm focus:ring-2 focus:ring-primary/50 transition-all placeholder:text-on-surface-variant/30" placeholder="0.00"/>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6">
                        <button id="submitBtn" type="submit" class="w-full h-16 bg-secondary text-[#003824] font-nav-label text-[18px] font-bold rounded-2xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-3 primary-glow disabled:opacity-50 disabled:cursor-not-allowed">
                            <span id="btnIcon" class="material-symbols-outlined">description</span>
                            <span id="btnText">Execute 11-Month Renewal</span>
                            <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-[#003824] border-t-transparent"></div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    // Global variable to hold the fetched tenant IDs for the payload
    let activeTenantIds = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const flatSelect = document.getElementById('flatSelect');
        const submitBtn = document.getElementById('submitBtn');

        // Initially disable the button
        submitBtn.disabled = true;

        // MVP FALLBACK: If your backend does not have GET /api/apartments yet,
        // we will populate this with a few hardcoded options to keep the UI unblocked.
        // Replace this fetch block with a real call once you build that endpoint.
        try {
            // Simulated Fetch: const response = await fetch('/api/apartments');
            const mockApartments = [
                { flatNumber: "101" }, { flatNumber: "202" }, { flatNumber: "305" }, { flatNumber: "204" }
            ];

            flatSelect.innerHTML = '<option value="" disabled selected>Select an occupied flat...</option>';
            mockApartments.forEach(apt => {
                flatSelect.innerHTML += `<option value="${apt.flatNumber}">Flat ${apt.flatNumber}</option>`;
            });
        } catch (error) {
            flatSelect.innerHTML = '<option value="" disabled>Error loading apartments</option>';
        }

        // Event Listener: When a flat is selected, fetch its current active lease
        flatSelect.addEventListener('change', async (e) => {
            const flatId = e.target.value;
            const tenantContainer = document.getElementById('tenantContainer');

            // Reset fields while loading and disable button
            tenantContainer.innerHTML = '<span class="text-xs text-on-surface-variant animate-pulse">Fetching lease records...</span>';
            activeTenantIds = [];
            submitBtn.disabled = true;

            try {
                // Fetch the current active lease for this specific flat
                const response = await fetch(`/api/leases/apartment/${flatId}`);
                if (!response.ok) throw new Error('No active lease found for this flat.');

                const leaseData = await response.json();
                submitBtn.disabled = false; // Enable button on success

                // 1. Populate Tenants
                if (leaseData.tenantDtos && leaseData.tenantDtos.length > 0) {
                    tenantContainer.innerHTML = ''; // Clear loading text
                    leaseData.tenantDtos.forEach(tenant => {
                        activeTenantIds.push(tenant.id);
                        tenantContainer.innerHTML += `
                            <div class="px-3 py-1 bg-primary/10 border border-primary/20 rounded-full flex items-center gap-2">
                                <span class="material-symbols-outlined text-[14px] text-primary">person</span>
                                <span class="text-xs font-bold text-primary">${tenant.name}</span>
                            </div>
                        `;
                    });
                } else {
                    tenantContainer.innerHTML = '<span class="text-xs text-error">No tenants attached to this lease.</span>';
                    submitBtn.disabled = true; // Disable if no tenants
                }

                // 2. Automate Date Math (11 Months)
                if (leaseData.end) {
                    const oldEndDate = new Date(leaseData.end);

                    // Set New Start Date (Next day after old lease expires)
                    const newStartDate = new Date(oldEndDate);
                    newStartDate.setDate(newStartDate.getDate() + 1);
                    document.getElementById('startDate').value = newStartDate.toISOString().split('T')[0];

                    // Set New End Date (Start Date + 11 Months)
                    const newEndDate = new Date(newStartDate);
                    newEndDate.setMonth(newEndDate.getMonth() + 11);
                    document.getElementById('endDate').value = newEndDate.toISOString().split('T')[0];
                }

                // 3. Pre-fill Financials
                document.getElementById('monthlyRent').value = leaseData.rentAmount || '';
                document.getElementById('maintenanceFee').value = leaseData.maintenanceAmount || '';

            } catch (error) {
                tenantContainer.innerHTML = `<span class="text-xs text-error">${error.message}</span>`;
                submitBtn.disabled = true; // Disable on error
                // Clear financial/date inputs if fetch fails
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                document.getElementById('monthlyRent').value = '';
                document.getElementById('maintenanceFee').value = '';
            }
        });

        // Recalculate 11-month End Date if user manually overrides the Start Date
        document.getElementById('startDate').addEventListener('change', (e) => {
            if (e.target.value) {
                const start = new Date(e.target.value);
                const newEnd = new Date(start);
                newEnd.setMonth(newEnd.getMonth() + 11);
                document.getElementById('endDate').value = newEnd.toISOString().split('T')[0];
            }
        });
    });

    // Form Submission Logic
    document.getElementById('renewalForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (activeTenantIds.length === 0) {
            alert("Cannot renew lease: No active tenants selected.");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const loader = document.getElementById('loader');

        // UI Loading State
        submitBtn.disabled = true;
        btnText.textContent = "Validating...";
        btnIcon.classList.add('hidden');
        loader.classList.remove('hidden');

        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());

        try {
            // POST to /api/leases to create the new contract
            const response = await fetch('/api/leases', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    start: new Date(data.startDate).toISOString(),
                    end: new Date(data.endDate).toISOString(),
                    flatNumber: data.flatId,
                    tenantIds: activeTenantIds, // Dynamically populated array of Longs
                    rentAmount: parseFloat(data.monthlyRent),
                    maintenanceAmount: parseFloat(data.maintenanceFee),
                    depositAmount: 0.00,
                    isDepositCollected: true
                })
            });

            if (!response.ok) {
                throw new Error(`Lease renewal failed: ${response.statusText}`);
            }

            alert(`11-Month Lease Renewal Successfully Registered for Flat ${data.flatId}`);
            window.location.href = '/owner-pages/apartments.html';

        } catch (error) {
            console.error('Renewal failed:', error);
            alert(`Error: ${error.message}`);
            submitBtn.disabled = false;
            btnText.textContent = "Execute 11-Month Renewal";
            btnIcon.classList.remove('hidden');
            loader.classList.add('hidden');
        }
    });
</script>
</body></html>
