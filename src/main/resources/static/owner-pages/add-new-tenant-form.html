                },
            },
        };
    </script><style>

            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style><title>Add New Tenant</title></head><body class="bg-background text-on-surface font-body min-h-screen">
<!-- Fixed Sidebar -->
<aside class="fixed left-0 top-0 h-screen w-64 bg-slate-900/80 dark:bg-surface-container backdrop-blur-3xl shadow-2xl shadow-blue-900/20 flex flex-col p-6 z-50">

    <nav class="flex-1 space-y-2">

        <a href="/owner-pages/apartments.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-slate-200 transition-colors group font-headline tracking-tight font-semibold">

        </a>

        </a>
        <a href="/owner-pages/configuration.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-slate-200 transition-colors group font-headline tracking-tight font-semibold">
            <span class="material-symbols-outlined mr-3">settings</span><span>Settings</span>
        </a>
    </nav>
    <div class="mt-auto pt-6 border-t border-white/5 flex flex-col gap-3">
        <a href="/owner-pages/add-new-lease.html" class="bg-primary text-on-primary py-3 rounded-xl font-bold font-headline tracking-tight flex items-center justify-center gap-2 hover:shadow-[0_0_20px_rgba(173,198,255,0.3)] transition-all">
            <span class="material-symbols-outlined">add_card</span><span>Create New Lease</span>
        </a>

            <span class="material-symbols-outlined">add_home</span><span>Add New Property</span>
        </a>
    </div>
</aside>
<!-- Top Header -->
<header class="fixed top-0 right-0 w-[calc(100%-16rem)] h-16 backdrop-blur-2xl bg-surface/80 border-b border-outline-variant/10 flex justify-between items-center px-10 z-40">
    <div class="flex items-center flex-1 max-w-md">
        <div class="relative w-full group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">search</span>
            <input type="text" placeholder="Search..." class="w-full bg-surface-container-lowest border-none rounded-full py-2 pl-12 pr-4 text-sm focus:ring-1 focus:ring-primary placeholder:text-outline/50">
        </div>
    </div>
</header>
<!-- Main Content -->
<main class="ml-64 pt-16 min-h-screen relative">
    <div class="p-10 max-w-4xl mx-auto">
        <!-- Page Header -->
        <div class="mb-10">
            <span class="font-label uppercase text-[11px] tracking-[0.2em] text-primary/70 mb-2 block">MANAGEMENT / TENANTS</span>
            <h2 class="font-headline text-5xl font-extrabold text-on-surface">Add New Tenant</h2>
        </div>
        <!-- Form Card -->
        <div class="bg-surface-container-low rounded-3xl border border-outline-variant/10 p-8 lg:p-10">
            <form class="space-y-8" id="addTenantForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                    <!-- Form fields -->
                    <div class="flex flex-col gap-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="name">Full Name</label>
                        <input class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all" id="name" name="name" placeholder="John Doe" required type="text">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="email">Email Address</label>
                        <input class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all" id="email" name="email" placeholder="john.doe@example.com" required type="email">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="phoneNumber">Phone Number</label>
                        <input class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all" id="phoneNumber" name="phoneNumber" placeholder="+91 00000 00000" required type="tel">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="fatherName">Father's / Guardian's Name</label>
                        <input class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all" id="fatherName" name="fatherName" placeholder="Robert Doe" required type="text">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="uniqueIdentifier">Government ID / Aadhar Number</label>
                        <input class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all" id="uniqueIdentifier" name="uniqueIdentifier" placeholder="0000-0000-0000" required type="text">
                    </div>
                    <div class="flex items-center h-full pt-6">
                        <label class="relative inline-flex items-center cursor-pointer group">
                            <input class="sr-only peer" id="isBackgroundChecked" name="isBackgroundChecked" type="checkbox">
                            <div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
                            <span class="ml-3 font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant">Background Check Completed</span>
                        </label>
                    </div>
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="font-label text-[11px] uppercase tracking-[0.2em] text-on-surface-variant pl-1" for="address">Permanent / Previous Address</label>
                        <textarea class="bg-surface-container-lowest border-outline-variant/10 rounded-xl px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary transition-all resize-none" id="address" name="address" placeholder="Enter complete residential address..." required rows="3"></textarea>
                    </div>
                </div>
                <div class="border-t border-outline-variant/10 pt-8 flex justify-end">
                    <button class="bg-primary text-on-primary px-10 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed" id="submitButton" type="submit">
                        <span class="material-symbols-outlined text-[20px]">save</span>
                        Save & Register Tenant
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
<script>
    const form = document.getElementById('addTenantForm');
    const submitButton = document.getElementById('submitButton');
    const requiredFields = Array.from(form.querySelectorAll('[required]'));

    function validateForm() {
        const allValid = requiredFields.every(field => {
            if (field.type === 'checkbox') {
                return true; // Checkbox is optional for button enabling
            }
            return field.value.trim() !== '';
        });
        submitButton.disabled = !allValid;
    }

    requiredFields.forEach(field => {
        field.addEventListener('input', validateForm);
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (submitButton.disabled) return;

        const originalBtnText = submitButton.innerHTML;
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';

        const formData = new FormData(form);
        const updateTenantDto = {
            name: formData.get('name'),
            email: formData.get('email'),
            phoneNumber: formData.get('phoneNumber'),
            fatherName: formData.get('fatherName'),
            uniqueIdentifier: formData.get('uniqueIdentifier'),
            address: formData.get('address'),
            isBackgroundChecked: formData.get('isBackgroundChecked') === 'on'
        };

        try {
            const response = await fetch('/api/tenants', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updateTenantDto)
            });

            if (response.ok) {
                alert('Tenant Registered Successfully!');
                window.location.href = '/owner-pages/apartments.html';
            } else {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Failed to register tenant');
            }
        } catch (error) {
            alert(`Error: ${error.message}`);
            submitButton.disabled = false;
            submitButton.innerHTML = originalBtnText;
        }
    });

    // Initial validation check
    validateForm();
</script>
</body></html>
